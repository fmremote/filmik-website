name: Supabase heartbeat

on:
  schedule:
    # Vercel runs the companion protected check at 09:17 UTC.
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  keep-project-active:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run protected Supabase activity check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --retry 3 --retry-all-errors +            --header "Authorization: Bearer $CRON_SECRET" +            https://filmik.io/api/cron/supabase-activity
